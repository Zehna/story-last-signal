# Render StoryLastSignal — repo PUBLIK.
# CATATAN UKURAN: satu shard 120 frame ~375-625 MB (PNG 1080x1920 + MP4),
# melebihi batas artifact GitHub 500 MB untuk shard yang besar. Karena itu
# hasil AKHIR diunggah sebagai GitHub Release, bukan artifact. Shard tetap
# diunggah sebagai artifact antar-job (retention 1 hari); bila satu shard
# melebihi 500 MB, upload artifact shard itu akan gagal dan stitch tidak
# bisa berjalan — kurangi CRF/preset atau bagi shard lebih kecil.
# Alur: audio -> render_shards (matrix 0..4, 120 frame/runner) -> stitch.
# Render 3D memakai EGL surfaceless Mesa (GL 330 core di ubuntu-latest).
name: Render StoryLastSignal

on:
  workflow_dispatch:

jobs:
  audio:
    name: Audio (SoX + FFmpeg loudnorm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg + SoX
        run: sudo apt-get update && sudo apt-get install -y ffmpeg sox
      - name: Install Python deps
        run: pip install numpy
      - name: Generate last-signal.wav
        working-directory: story-last-signal
        run: python scripts/generate-story-audio.py
      - name: Upload WAV
        uses: actions/upload-artifact@v4
        with:
          name: last-signal-wav
          path: story-last-signal/public/sfx/last-signal.wav
          retention-days: 1

  render_shards:
    name: Render shard ${{ matrix.shard }} (120 frame)
    runs-on: ubuntu-latest
    needs: audio
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      START: ${{ matrix.shard * 120 }}
      END: ${{ matrix.shard * 120 + 119 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install sistem (FFmpeg, SoX, Mesa EGL)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg sox libegl1 libgl1-mesa-dri
      - name: Install Python deps
        run: pip install numpy pillow PyOpenGL DracoPy
      - name: Prepare aset Cassini (Draco -> cache)
        working-directory: story-last-signal
        run: python scripts/prepare_story_assets.py
      - name: Render 3D shard (OpenGL/EGL)
        working-directory: story-last-signal
        env:
          EGL_PLATFORM: surfaceless
          PYOPENGL_PLATFORM: egl
        run: python scripts/render_story_3d.py --start "$START" --end "$END" --out out/frames
      - name: Download WAV audio (dari job audio)
        uses: actions/download-artifact@v4
        with:
          name: last-signal-wav
          path: story-last-signal/public/sfx
      - name: Salin frame ke public Remotion
        run: |
          mkdir -p story-last-signal/public/frames story-last-signal/public/sfx
          cp story-last-signal/out/frames/frame_*.png story-last-signal/public/frames/
      - name: Render overlay Remotion (PNG transparan)
        working-directory: story-last-signal
        run: |
          ../node_modules/.bin/remotion render src/index.ts StoryLastSignal "../out/overlay/shard-${{ matrix.shard }}" --image-format=png --frames="$START-$END" --props='{"includeBaseVideo": false}'
      - name: Composite 3D + overlay (ffmpeg)
        run: |
          if [ "${{ matrix.shard }}" = "4" ]; then FADE=",fade=t=out:s=100:n=20:c=#050814"; else FADE=""; fi
          ffmpeg -y -framerate 30 -i story-last-signal/out/frames/frame_%04d.png -framerate 30 -i out/overlay/shard-${{ matrix.shard }}/%04d.png -filter_complex "[0:v][1:v]overlay=0:0:format=yuv420:shortest=1${FADE}[v]" -map "[v]" -c:v libx264 -preset medium -crf 10 -g 1 -pix_fmt yuv420p out/shard-${{ matrix.shard }}.mp4
      - name: Upload shard MP4
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}.mp4
          retention-days: 1

  stitch:
    name: Stitch + GitHub Release
    runs-on: ubuntu-latest
    needs: [render_shards, audio]
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download shard MP4
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
      - name: Download WAV
        uses: actions/download-artifact@v4
        with:
          name: last-signal-wav
          path: wav
      - name: Concat + final encode
        run: |
          rm -f shards.txt
          for i in 0 1 2 3 4; do echo "file 'shards/shard-$i.mp4'" >> shards.txt; done
          cat shards.txt
          ffmpeg -y -f concat -safe 0 -i shards.txt -i wav/last-signal.wav -map 0:v -map 1:a -c:v libx264 -preset slow -crf 15 -c:a aac -b:a 256k -ar 48000 -movflags +faststart story-last-signal-final.mp4
          ls -lh story-last-signal-final.mp4
      - name: GitHub Release (hasil akhir, bukan artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="story-last-signal-v$GITHUB_RUN_NUMBER"
          gh release create "$TAG" story-last-signal-final.mp4 --title "StoryLastSignal v$GITHUB_RUN_NUMBER" --notes "Render 600 frame 1080x1920 @30fps + audio last-signal.wav (-14 LUFS). Shard hanya artifact antar-job."
